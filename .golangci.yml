version: 2

run:
  timeout: 5m
  tests: true

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  goconst:
    min-len: 2
    min-occurrences: 2
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
  gocyclo:
    min-complexity: 15
  goimports:
    local-prefixes: github.com/joshxtra/atem-go
  gomnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
  govet:
    check-shadowing: true
  lll:
    line-length: 140
  misspell:
    locale: US
  nolintlint:
    allow-leading-space: true
    allow-unused: false
    require-explanation: false
    require-specific: false

linters:
  # Enable default linters
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - gocyclo
    - goconst
    - misspell
    - revive
    - nolintlint
    - gosec
    - unconvert
    - unparam
    - whitespace
    - copyloopvar

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gomnd
        - funlen
        - errcheck
    - path: example/.*
      linters:
        - package-comments
    - path: models/.*
      linters:
        - exported
        - package-comments
    - path: packet/cmds/.*
      linters:
        - exported
        - package-comments
    - path: packet/.*
      linters:
        - exported
  max-issues-per-linter: 0
  max-same-issues: 0

